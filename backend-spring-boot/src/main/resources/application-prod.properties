# Production PostgreSQL Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/poster35}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

poster35.jwt.secret=${JWT_SECRET}
poster35.jwt.expiration-ms=604800000

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

poster35.pricing.default-price=35
poster35.pricing.delivery-fee=49
poster35.pricing.free-threshold=175
