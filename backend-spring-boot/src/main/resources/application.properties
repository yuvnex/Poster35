# Spring Boot Server
server.port=8080
server.servlet.context-path=/api

# Local Development Embedded Database (H2)
spring.datasource.url=jdbc:h2:file:./data/poster35_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT
poster35.jwt.secret=poster35_super_secure_spring_boot_jwt_secret_key_2026_longer_than_256_bits
poster35.jwt.expiration-ms=604800000

# Payment Gateway (Razorpay)
razorpay.key.id=
razorpay.key.secret=

# Pricing & Shipping Defaults
poster35.pricing.default-price=35
poster35.pricing.delivery-fee=49
poster35.pricing.free-threshold=175
